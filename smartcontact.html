<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-API Contact Manager</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #eee; }
    .container { background: white; padding: 20px; max-width: 900px; margin: auto; }
    #login-section { max-width: 400px; }
    .hidden { display: none; }
    input { padding: 8px; margin: 4px 0; }
    button { padding: 8px 12px; cursor: pointer; }
    .form-group { margin-bottom: 12px; }
    .error-msg { color: red; display: block; margin: 8px 0; }
    .quote-box { background: #eee; padding: 10px; margin: 15px 0; display: flex; justify-content: space-between; }
    .quote-text { font-style: italic; }
    .add-contact-bar { margin-bottom: 15px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #ddd; }
    .avatar-img { width: 45px; height: 45px; }
  </style>
</head>
<body>

  <div id="login-section" class="container">
    <h2>Login</h2>
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Min 6 characters">
      </div>
      <span id="login-error" class="error-msg"></span>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <div id="dashboard-section" class="container hidden">
    <div class="header-bar">
      <div>
        <h2>Smart Contacts Dashboard</h2>
        <small id="welcome-user"></small>
      </div>
      <button id="logout-btn">Logout</button>
    </div>

    <div class="quote-box">
      <p id="quote-display" class="quote-text">Loading daily quote...</p>
      <button id="new-quote-btn">New Quote</button>
    </div>

    <form id="add-contact-form" class="add-contact-bar">
      <input type="text" id="new-name" placeholder="Contact name" required>
      <input type="email" id="new-email" placeholder="Email address" required>
      <input type="text" id="new-phone" placeholder="Phone number" required>
      <button type="submit">Add contact</button>
    </form>

    <div class="form-group">
      <input type="text" id="search-input" placeholder="Search by name or email">
    </div>

    <table>
      <thead>
        <tr>
          <th>Avatar</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script>
    let contactsData = [];

    const loginSection = document.getElementById('login-section');
    const dashboardSection = document.getElementById('dashboard-section');
    const loginForm = document.getElementById('login-form');
    const addContactForm = document.getElementById('add-contact-form');
    const tableBody = document.getElementById('table-body');
    const quoteDisplay = document.getElementById('quote-display');

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('loggedInUser');
      if (savedUser) showDashboard(savedUser);
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorSpan = document.getElementById('login-error');

      if (!email.includes('@') || password.length < 6) {
        errorSpan.textContent = 'Enter a valid email and a password of 6+ chars.';
        return;
      }

      errorSpan.textContent = '';
      localStorage.setItem('loggedInUser', email);
      showDashboard(email);
    });

    function showDashboard(userEmail) {
      loginSection.classList.add('hidden');
      dashboardSection.classList.remove('hidden');
      document.getElementById('welcome-user').textContent = `Logged in as: ${userEmail}`;
      
      fetchContacts();
      fetchRandomQuote();
    }

    async function fetchContacts() {
      tableBody.innerHTML = '<tr><td colspan="5">Loading contacts...</td></tr>';
      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/users');
        contactsData = await res.json();
        renderTable(contactsData);
      } catch (err) {
        tableBody.innerHTML = '<tr><td colspan="5">Error loading contacts.</td></tr>';
      }
    }

    async function fetchRandomQuote() {
      quoteDisplay.textContent = 'Fetching quote...';
      try {
        const res = await fetch('https://dummyjson.com/quotes/random');
        const data = await res.json();
        quoteDisplay.textContent = `"${data.quote}" — ${data.author}`;
      } catch (err) {
        quoteDisplay.textContent = '"Keep coding and keep it simple!"';
      }
    }

    addContactForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newContact = {
        name: document.getElementById('new-name').value.trim(),
        email: document.getElementById('new-email').value.trim(),
        phone: document.getElementById('new-phone').value.trim()
      };

      try {
        const res = await fetch('https://jsonplaceholder.typicode.com/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newContact)
        });
        const savedContact = await res.json();
        
        savedContact.id = Date.now();
        contactsData.unshift(savedContact);
        renderTable(contactsData);
        addContactForm.reset();
      } catch (err) {
        alert('Failed to add contact');
      }
    });

    async function deleteContact(id) {
      await fetch(`https://jsonplaceholder.typicode.com/users/${id}`, { method: 'DELETE' });
      contactsData = contactsData.filter(c => c.id !== id);
      renderTable(contactsData);
    }

    function renderTable(list) {
      tableBody.innerHTML = '';
      list.forEach(contact => {
        const avatarUrl = `https://robohash.org/${encodeURIComponent(contact.name)}?set=set4&size=80x80`;
        
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><img src="${avatarUrl}" alt="avatar" class="avatar-img"></td>
          <td><strong>${contact.name}</strong></td>
          <td>${contact.email}</td>
          <td>${contact.phone.split(' ')[0]}</td>
          <td><button onclick="deleteContact(${contact.id})">Delete</button></td>
        `;
        tableBody.appendChild(row);
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = contactsData.filter(c => 
        c.name.toLowerCase().includes(term) || c.email.toLowerCase().includes(term)
      );
      renderTable(filtered);
    });

    document.getElementById('new-quote-btn').addEventListener('click', fetchRandomQuote);

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('loggedInUser');
      dashboardSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
    });
  </script>
</body>
</html>
